name: Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify LF normalization
        run: |
          if git diff --check --exit-code; then
            echo "✓ Working tree is clean (LF normalized)"
          else
            echo "✗ Mixed line endings detected"
            git diff --check
            exit 1
          fi

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    # Evita dois deploys simultâneos sem cancelar um que já esteja publicando
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Publica só o que o navegador carrega; tests/, docs/ e scripts/ ficam fora do site
      - name: Assemble site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          mkdir _site
          cp index.html _site/
          cp -r src _site/src
          touch _site/.nojekyll

          # Em site de projeto (usuario.github.io/repo) os caminhos absolutos "/src/..."
          # e "/" do manifest apontariam para a raiz do domínio e quebrariam o parser de PDF Tasy
          if [ -n "$BASE_PATH" ]; then
            sed -i "s#'/src/vendor/#'${BASE_PATH}/src/vendor/#g" _site/src/js/parsers/pdfTasyParser.js
            sed -i "s#\"/\"#\"${BASE_PATH}/\"#g" _site/src/assets/manifest.json
            grep -q "'${BASE_PATH}/src/vendor/pdf.min.mjs'" _site/src/js/parsers/pdfTasyParser.js
            grep -q "\"start_url\": \"${BASE_PATH}/\"" _site/src/assets/manifest.json
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
